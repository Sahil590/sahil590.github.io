about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Sahil — a Software Developer with a passion for building robust software and web applications. I have experience working with **Python**, **Rust**, and **JavaScript**, and have contributed across a range of roles from IT support to research software engineering.

  I studied Computer Science at Brunel University London and have been working at Imperial College London since late 2022, where I am part of the central Research Software Engineering team.


