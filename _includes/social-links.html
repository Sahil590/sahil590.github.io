<ul class="social-links" aria-label="Social links">
  {% if site.github_username %}<li><a href="https://github.com/{{ site.github_username | escape }}">GitHub ↗</a></li>{% endif %}
  {% if site.linkedin_username %}<li><a href="https://www.linkedin.com/in/{{ site.linkedin_username | escape }}/">LinkedIn ↗</a></li>{% endif %}
  {% for link in site.additional_links %}<li><a href="{{ link.url | escape }}">{{ link.title | escape }} ↗</a></li>{% endfor %}
</ul>
