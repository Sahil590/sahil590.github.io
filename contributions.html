<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Source Contributions | Sahil Raja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #24292f;
      background: #f6f8fa;
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.25rem;
    }

    .subtitle {
      color: #666;
      font-size: 0.875rem;
      margin: 0 0 1.5rem;
    }

    /* Filter buttons */
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: 1px solid #d0d7de;
      background: #fff;
      color: #24292f;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #0969da;
      border-color: #0969da;
      color: #fff;
    }

    /* PR list */
    .pr-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .pr-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
    }

    .pr-repo {
      font-size: 0.78rem;
      color: #0969da;
      text-decoration: none;
      font-weight: 600;
    }
    .pr-repo:hover { text-decoration: underline; }

    .pr-title {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: #24292f;
      text-decoration: none;
      margin: 0.15rem 0 0.5rem;
    }
    .pr-title:hover { color: #0969da; }

    .pr-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: #656d76;
    }

    .badge {
      padding: 0.15rem 0.55rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-merged { background: #8250df1a; color: #8250df; border: 1px solid #8250df40; }
    .badge-open   { background: #1a7f371a; color: #1a7f37; border: 1px solid #1a7f3740; }
    .badge-closed { background: #cf222e1a; color: #cf222e; border: 1px solid #cf222e40; }

    /* States */
    .state-msg {
      padding: 2.5rem;
      text-align: center;
      color: #888;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #666;
    }
    .pagination button {
      padding: 0.3rem 0.75rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .pagination button:hover:not(:disabled) { border-color: #0969da; color: #0969da; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

  <h1>Open Source Contributions</h1>
  <p class="subtitle">Pull requests by sahil590 on public repositories they do not own &mdash; fetched live from the GitHub API.</p>

  <div class="filters" id="filters" style="display:none;">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="merged">Merged</button>
    <button class="filter-btn" data-filter="open">Open</button>
    <button class="filter-btn" data-filter="closed">Closed</button>
  </div>

  <div id="pr-container">
    <div class="state-msg"><div class="spinner"></div>Loading&hellip;</div>
  </div>

  <div class="pagination" id="pagination" style="display:none;">
    <button id="btn-prev">&#8592; Prev</button>
    <span id="page-info"></span>
    <button id="btn-next">Next &#8594;</button>
  </div>

  <script>
    const USERNAME = 'sahil590';
    const PER_PAGE = 15;
    let allPRs = [], filtered = [], currentPage = 1;

    function getState(pr) {
      return pr.pull_request?.merged_at ? 'merged' : pr.state;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function repoName(url) {
      const p = url.split('/');
      return { full: `${p[3]}/${p[4]}`, url: `https://github.com/${p[3]}/${p[4]}` };
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderCard(pr) {
      const state = getState(pr);
      const repo  = repoName(pr.html_url);
      const badge = { merged: 'badge-merged', open: 'badge-open', closed: 'badge-closed' }[state];
      const label = state.charAt(0).toUpperCase() + state.slice(1);
      return `
        <div class="pr-card">
          <a href="${repo.url}" target="_blank" rel="noopener" class="pr-repo">${repo.full}</a>
          <a href="${pr.html_url}" target="_blank" rel="noopener" class="pr-title">${esc(pr.title)}</a>
          <div class="pr-meta">
            <span class="badge ${badge}">${label}</span>
            <span>Updated ${formatDate(pr.updated_at)}</span>
            ${pr.comments ? `<span>${pr.comments} comment${pr.comments !== 1 ? 's' : ''}</span>` : ''}
          </div>
        </div>`;
    }

    function render() {
      const start = (currentPage - 1) * PER_PAGE;
      const page  = filtered.slice(start, start + PER_PAGE);
      const container = document.getElementById('pr-container');

      if (!filtered.length) {
        container.innerHTML = '<div class="state-msg">No contributions found for this filter.</div>';
        document.getElementById('pagination').style.display = 'none';
        return;
      }

      container.innerHTML = `<div class="pr-list">${page.map(renderCard).join('')}</div>`;

      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      document.getElementById('page-info').textContent = `${currentPage} / ${totalPages}`;
      document.getElementById('btn-prev').disabled = currentPage === 1;
      document.getElementById('btn-next').disabled = currentPage === totalPages;
      document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
    }

    async function fetchAll() {
      const results = [];
      for (let page = 1; page <= 3; page++) {
        const url =
          `https://api.github.com/search/issues` +
          `?q=type:pr+author:${USERNAME}+-user:${USERNAME}+is:public` +
          `&sort=updated&order=desc&per_page=100&page=${page}`;
        const res = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });
        if (res.status === 403) throw new Error('GitHub API rate limit reached — please try again in a few minutes.');
        if (!res.ok) throw new Error(`GitHub API error ${res.status}`);
        const data = await res.json();
        results.push(...data.items);
        if (results.length >= data.total_count || data.items.length < 100) break;
      }
      return results;
    }

    (async () => {
      try {
        allPRs   = await fetchAll();
        filtered = allPRs;
        document.getElementById('filters').style.display = 'flex';
        render();
      } catch (err) {
        document.getElementById('pr-container').innerHTML =
          `<div class="state-msg">${esc(err.message)}</div>`;
      }
    })();

    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
      const f = btn.dataset.filter;
      filtered = f === 'all' ? allPRs : allPRs.filter(p => getState(p) === f);
      currentPage = 1;
      render();
    });

    document.getElementById('btn-prev').addEventListener('click', () => { currentPage--; render(); scrollTo(0,0); });
    document.getElementById('btn-next').addEventListener('click', () => { currentPage++; render(); scrollTo(0,0); });
  </script>

</body>
</html>
